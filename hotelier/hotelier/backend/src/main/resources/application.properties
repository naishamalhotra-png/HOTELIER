spring.application.name=hotelier
server.port=${PORT:8080}

# Default (local) database: H2 file stored in ./data - survives restarts.
spring.datasource.url=jdbc:h2:file:./data/hotelier;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# HOTELIER settings (all can be overridden with environment variables)
hotelier.timezone=${HOTELIER_TIMEZONE:Asia/Kolkata}
hotelier.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
hotelier.export-dir=${EXPORT_DIR:exports}
hotelier.seed-demo-data=${SEED_DEMO_DATA:true}
